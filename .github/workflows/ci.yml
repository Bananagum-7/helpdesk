name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      # Scripted LLMs: covers every graph path, the MCP server over stdio and the eval scorer, no API key needed
      - run: pytest -q
      - name: Ticket set builds and is balanced
        run: python eval/build_tickets.py
